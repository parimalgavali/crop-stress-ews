name: Pages demo

# Static demo (ADR 0014): the UI reads web/public/demo/<year>.json instead of the API.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 */5 * *" # live season data (ADR 0015)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 150
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Live season data (ADR 0015); the demo still deploys if this fails
        continue-on-error: true
        timeout-minutes: 120
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -e ".[extract,model]"
          # Crop-map model (ADR 0018), published as a release asset; Live runs without it if absent.
          gh release download cropmap-v1 -p cropmap_y_wheat.joblib -D models || true
          mkdir -p data/raw/lwk data/raw/vg2500
          curl -sfL -o data/raw/lwk.zip https://www.opengeodata.nrw.de/produkte/umwelt_klima/bodennutzung/landwirtschaft/LWK-TSCHLAG_EPSG25832_Shape.zip
          unzip -q -o data/raw/lwk.zip -d data/raw/lwk
          curl -sfL -o data/raw/vg2500.zip https://daten.gdz.bkg.bund.de/produkte/vg/vg2500/aktuell/vg2500_12-31.utm32s.shape.zip
          unzip -q -o data/raw/vg2500.zip -d data/raw/vg2500
          python scripts/live_update.py --lwk data/raw/lwk/V_OD_LWK_TSCHLAG.shp \
            --districts "$(find data/raw/vg2500 -name VG2500_KRS.shp | head -1)" \
            --cropmap models/cropmap_y_wheat.joblib
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_STATIC_DEMO: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
