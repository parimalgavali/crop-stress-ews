name: Pages demo

# Static demo (ADR 0014): the UI reads web/public/demo/<year>.json instead of the API.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 */5 * *" # live season data (ADR 0015)

permissions:
  contents: write # forecast-log branch (ADR 0020)
  issues: write # pipeline-health issue (ADR 0023)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 150
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Live season data (ADR 0015); the demo still deploys if this fails
        id: live
        continue-on-error: true
        timeout-minutes: 120
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Last deployed run, to alert only on fields that newly turned red (ADR 0022).
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          curl -sfL -o ../previous.json "$site/live/latest.json" || true
          # Push deploys reuse the deployed live data, so a red change is only published by a
          # scheduled or manual run, which also sends its alerts.
          if [ "${{ github.event_name }}" = push ] && [ -s ../previous.json ]; then
            mkdir -p web/public/live && cp ../previous.json web/public/live/latest.json
            curl -sfL -o web/public/live/scoreboard.json "$site/live/scoreboard.json" || rm -f web/public/live/scoreboard.json
            exit 0
          fi
          pip install -e ".[extract,model]"
          # Crop-map model (ADR 0018), published as a release asset; Live runs without it if absent.
          gh release download cropmap-v1 -p "cropmap_y_wheat_*.joblib" -D models || true
          # Spring risk model (ADR 0021); used from 5 April only.
          gh release download risk-v1 -p risk_live.joblib -D models || true
          # Model files are unpickled, so only use them if they match the pinned checksums.
          (cd models && sha256sum -c --ignore-missing ../models.sha256) || rm -rf models
          mkdir -p data/raw/lwk data/raw/vg2500
          curl -sfL -o data/raw/lwk.zip https://www.opengeodata.nrw.de/produkte/umwelt_klima/bodennutzung/landwirtschaft/LWK-TSCHLAG_EPSG25832_Shape.zip
          unzip -q -o data/raw/lwk.zip -d data/raw/lwk
          curl -sfL -o data/raw/vg2500.zip https://daten.gdz.bkg.bund.de/produkte/vg/vg2500/aktuell/vg2500_12-31.utm32s.shape.zip
          unzip -q -o data/raw/vg2500.zip -d data/raw/vg2500
          python scripts/live_update.py --lwk data/raw/lwk/V_OD_LWK_TSCHLAG.shp \
            --districts "$(find data/raw/vg2500 -name VG2500_KRS.shp | head -1)" \
            --cropmap models --risk-model models/risk_live.joblib
      - name: Pipeline health (ADR 0023); opens, updates or closes the pipeline-health issue
        id: health
        if: github.event_name != 'push'
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --label pipeline-health --state open --json number -q '.[0].number' || true)
          summary=$(python scripts/check_live_health.py web/public/live/latest.json 2>&1) && ok=1 || ok=0
          [ "$LIVE_OUTCOME" = success ] || ok=0
          echo "healthy=$ok" >> "$GITHUB_OUTPUT"
          if [ $ok = 1 ]; then
            echo "healthy: $summary"
            if [ -n "$open" ]; then gh issue close "$open" -c "Healthy again: $summary. $RUN_URL"; fi
          else
            msg="The live run failed or produced too little data (live step: $LIVE_OUTCOME; $summary). The site keeps the last deployed data. $RUN_URL"
            echo "unhealthy: $msg"
            # Keep the last good data on the site; the UI then shows the stale-data notice.
            if [ -s ../previous.json ]; then mkdir -p web/public/live && cp ../previous.json web/public/live/latest.json; fi
            if [ -n "$open" ]; then gh issue comment "$open" -b "$msg"
            else
              gh label create pipeline-health -c B60205 -d "Live pipeline run failed" 2>/dev/null || true
              gh issue create -t "Live pipeline run unhealthy" -l pipeline-health -b "$msg"
            fi
          fi
      - name: Prospective forecast log (ADR 0020), on the forecast-log branch, never main
        if: github.event_name != 'push' && steps.health.outputs.healthy == '1'
        continue-on-error: true
        working-directory: .
        run: |
          git fetch origin forecast-log:forecast-log 2>/dev/null \
            && git worktree add ../log forecast-log \
            || { git worktree add --detach ../log && git -C ../log checkout --orphan forecast-log && git -C ../log rm -rqf .; }
          python scripts/forecast_log.py --log ../log/forecasts.csv --outcomes ../log/outcomes.parquet
          cd ../log
          if [ -f forecasts.csv ]; then
            git add forecasts.csv
            git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
              commit -qm "Forecasts issued $(date -u +%FT%TZ)" && git push -q origin forecast-log || true
          fi
      - name: Alerts for fields that turned red (ADR 0022), opt-in ntfy.sh topics
        if: github.event_name != 'push' && steps.health.outputs.healthy == '1'
        continue-on-error: true
        working-directory: .
        run: |
          [ -f web/public/live/latest.json ] && python scripts/send_alerts.py --previous ../previous.json || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_STATIC_DEMO: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
